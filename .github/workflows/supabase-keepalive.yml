name: Supabase keep-alive

# Pings the Supabase project twice a week so the free plan never auto-pauses.
# If the ping fails (for example the project is already paused), this job fails
# and GitHub emails you, so you hear about it before the app breaks.

on:
  schedule:
    - cron: "17 13 * * 1,4"   # Mondays and Thursdays, 13:17 UTC
  workflow_dispatch:           # lets you run it by hand from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Missing SUPABASE_URL or SUPABASE_ANON_KEY repository secret"; exit 1
          fi
          code=$(curl -sS -o /dev/null -w "%{http_code}" --retry 3 --retry-delay 10 \
            -H "apikey: $SUPABASE_ANON_KEY" \
            "${SUPABASE_URL%/}/rest/v1/")
          echo "Supabase responded with HTTP $code"
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then exit 1; fi
